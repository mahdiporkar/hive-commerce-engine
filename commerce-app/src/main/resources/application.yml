# Hive Commerce Engine. Secrets and endpoints come from the environment only (ADR-0014).
spring:
  application:
    name: commerce-engine
  main:
    banner-mode: off
  datasource:
    url: ${COMMERCE_DB_URL}
    username: ${COMMERCE_DB_USER:commerce_app}
    password: ${COMMERCE_DB_PASSWORD}
  flyway:
    enabled: false # schema-per-context migrations are configured in SchemaMigrations
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
      fail-on-unknown-properties: true

server:
  port: ${COMMERCE_PORT:8090}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Same switch as Hive: production unless explicitly downgraded for local work and tests.
hive:
  profile: ${HIVE_PROFILE:production}

springdoc:
  api-docs:
    enabled: ${COMMERCE_OPENAPI_ENABLED:false}

commerce:
  config-schema-version: "1.0.0"
  tenant-id: ${COMMERCE_TENANT_ID:default}
  store:
    key: ${COMMERCE_STORE_KEY}
    mode: ${COMMERCE_STORE_MODE:SINGLE_VENDOR}
    default-currency: ${COMMERCE_STORE_CURRENCY:IRR}
    locales: ${COMMERCE_STORE_LOCALES:fa,en}
  capabilities:
    physical-products: ${COMMERCE_CAP_PHYSICAL:true}
    digital-products: ${COMMERCE_CAP_DIGITAL:true}
    seller-onboarding: ${COMMERCE_CAP_SELLER_ONBOARDING:false}
    commissions: ${COMMERCE_CAP_COMMISSIONS:false}
    reviews: ${COMMERCE_CAP_REVIEWS:false}
  pricing:
    tax-rate-percent: ${COMMERCE_TAX_RATE_PERCENT:0}
    flat-shipping: ${COMMERCE_FLAT_SHIPPING:0}
  inventory:
    reservation-ttl: ${COMMERCE_RESERVATION_TTL:PT15M}
  checkout:
    guest-cart-ttl: ${COMMERCE_GUEST_CART_TTL:P7D}
  payments:
    provider: ${COMMERCE_PAYMENT_PROVIDER:}
    return-url: ${COMMERCE_PAYMENT_RETURN_URL:}
    fake:
      enabled: ${COMMERCE_FAKE_PAYMENTS:false}
      webhook-secret: ${COMMERCE_FAKE_PAYMENTS_SECRET:}
      psp-base-url: ${COMMERCE_FAKE_PSP_URL:http://fake-psp.invalid}
  finance:
    settlement-hold: ${COMMERCE_SETTLEMENT_HOLD:P7D}
  catalog:
    max-category-depth: ${COMMERCE_CATALOG_MAX_DEPTH:5}
  hive:
    route-key: ${COMMERCE_HIVE_ROUTE_KEY:commerce}
    enforce-operation: true
  security:
    jwt:
      issuer: ${COMMERCE_JWT_ISSUER}
      jwk-set-uri: ${COMMERCE_JWT_JWKS_URI}
      audience: ${COMMERCE_JWT_AUDIENCE:commerce-engine}
  migration:
    url: ${COMMERCE_DB_MIGRATION_URL:${COMMERCE_DB_URL}}
    username: ${COMMERCE_DB_OWNER_USER:commerce_owner}
    password: ${COMMERCE_DB_OWNER_PASSWORD}
    runtime-role: ${COMMERCE_DB_USER:commerce_app}
