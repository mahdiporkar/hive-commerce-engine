# Engine CI (ADR-0012). Independent of Hive's release coordinator; never deploys anything.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Hive starter and services from the pinned commit
        env:
          # Only needed while hive-platform is private: a read-only token for mahdiporkar/hive-platform.
          GIT_CONFIG_COUNT: ${{ secrets.HIVE_PLATFORM_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HIVE_PLATFORM_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: tools/build-hive-starter.sh --services
      - name: Unit, architecture, contract and integration tests
        run: ./mvnw -B install
      - name: Admin micro-frontends (bundle, SRI, schema-generated forms)
        run: tools/build-admin-mfes.sh
      - name: Storefront SDK
        working-directory: storefront-sdk
        run: npm ci --no-audit --no-fund && npm test
      - name: Through-Hive end-to-end tests (real BFF, authorization, OpenFGA, Keycloak)
        run: node --test tests/e2e/*.test.mjs
      - name: Keep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .local/e2e/
          retention-days: 7
